input { mongodb { uri => "mongodb://mongo_user:mongo_pass@mongo:27017/logs_db" collection => "logs" placeholder_db_dir => "/tmp/logstash-mongodb" bulk => true bulk_size => 1000 } }

filter { mutate { rename => { "extra.category" => "category" "extra.user_id" => "user_id" "extra.role" => "role" "extra.ip_address" => "ip_address" "extra.details" => "details" } } date { match => ["timestamp", "UNIX"] target => "@timestamp" } }

output { elasticsearch { hosts => ["http://elasticsearch:9200"] user => "elastic" password => "elastic_pass" index => "bigdefend-logs-%{+YYYY.MM.dd}" } stdout { codec => rubydebug } }